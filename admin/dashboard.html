<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Portfolio CMS | Divine Tattoo</title>

  <link
    rel="stylesheet"
    href="./admin.css"
  >
</head>

<body class="auth-checking">

  <main class="admin-shell">

    <!-- HEADER -->

    <header class="admin-header">

      <div>
        <p class="admin-eyebrow">
          DIVINE TATTOO
        </p>

        <h1>
          Portfolio
        </h1>

        <p class="admin-subtitle">
          Manage the images displayed on your website.
        </p>
      </div>

      <button
        id="logoutButton"
        type="button"
        class="logout-button"
      >
        Sign Out
      </button>

    </header>


    <!-- UPLOAD -->

    <section class="upload-section">

      <div class="section-heading">

        <div>
          <h2>
            Add Portfolio Images
          </h2>

          <p>
            Upload JPG, PNG, or WebP images.
          </p>
        </div>

      </div>


      <div class="upload-controls">

        <input
          id="imageInput"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          multiple
        >

        <button
          id="uploadButton"
          type="button"
          class="primary-button"
        >
          Upload Images
        </button>

      </div>


      <p
        id="uploadMessage"
        class="message"
        aria-live="polite"
      ></p>

    </section>


    <!-- PORTFOLIO -->

    <section class="portfolio-section">

      <div class="section-heading">

        <div>
          <h2>
            Your Portfolio
          </h2>

          <p>
            Drag images to change their order.
          </p>
        </div>

      </div>


      <p
        id="portfolioMessage"
        class="message"
        aria-live="polite"
      >
        Loading portfolio...
      </p>


      <div
        id="portfolioGrid"
        class="portfolio-grid"
      ></div>

    </section>

  </main>


  <!-- Supabase / CMS JavaScript -->

  <script
    type="module"
    src="./dashboard.js"
  ></script>

</body>
</html>
