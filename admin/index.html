<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0908">
  <title>Studio Login | Divine Tattoo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="refinement.css">
</head>
<body class="admin-login-body">
  <main class="login-page">
    <section class="login-panel" aria-labelledby="loginTitle">
      <span class="frame-corner corner-tl" aria-hidden="true"></span>
      <span class="frame-corner corner-tr" aria-hidden="true"></span>
      <span class="frame-corner corner-bl" aria-hidden="true"></span>
      <span class="frame-corner corner-br" aria-hidden="true"></span>

      <header class="login-brand">
        <img src="../assets/logo-480.jpg" alt="Divine Tattoo crest" class="admin-brand-mark">
        <div class="admin-brand-copy">
          <span class="admin-brand-name">Divine<em>Tattoo</em></span>
          <span class="admin-brand-kicker">Private Studio CMS</span>
        </div>
      </header>

      <div class="gk-divider" aria-hidden="true"></div>

      <div class="login-intro">
        <p class="eyebrow"><span class="star">✦</span> Private Management Access <span class="star">✦</span></p>
        <h1 id="loginTitle">Studio Login</h1>
        <p class="subtitle">Sign in to manage the portfolio displayed on the Divine Tattoo website.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="studio@email.com" autocomplete="email" inputmode="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <button type="submit" id="loginButton" class="primary-button">
          <span class="button-text">Sign In</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>

        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>

      <footer class="login-footer">
        <span class="footer-line" aria-hidden="true"></span>
        <p>Divine Tattoo <span>•</span> Authorized Studio Access</p>
        <span class="footer-line" aria-hidden="true"></span>
      </footer>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
